version: "3.9"

services:
  # ═══════════ PostgreSQL ═══════════
  postgres:
    image: postgres:16-alpine
    container_name: sovereign-postgres
    environment:
      POSTGRES_DB: sovereign_db
      POSTGRES_USER: sovereign
      POSTGRES_PASSWORD: sovereign
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign -d sovereign_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════ RabbitMQ ═══════════
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sovereign-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ═══════════ Redis ═══════════
  redis:
    image: redis:7-alpine
    container_name: sovereign-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
