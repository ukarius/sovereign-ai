server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sovereign_db
    username: sovereign
    password: sovereign
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379

# ═══════════════ JWT Configuration ═══════════════
app:
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: 86400000  # 24 hours

# ═══════════════ OpenAI Configuration ═══════════════
  openai:
    api-key: "${OPENAI_API_KEY:sk-placeholder}"
    model: "gpt-4o-mini"
    max-tokens: 500
    temperature: 0.3

# ═══════════════ Resilience4j Configuration ═══════════════
resilience4j:
  circuitbreaker:
    instances:
      aiTagging:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      aiTagging:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
